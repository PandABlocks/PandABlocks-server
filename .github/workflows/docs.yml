name: Docs CI

# Mirrors DiamondLightSource/myst-version-switcher-plugin
# .github/workflows/_docs.yml, but as a normal (non-reusable) workflow. This repo
# has no package.json: mystmd is run on demand via npx (pinned by MYSTMD_VERSION
# in CONFIG) and driven through the `make docs` task runner. switcher.json and the
# root redirect are written by the published version-switcher `switcher` action.

on:
  push:
    branches:
      - main
      - docs
    tags:
      - '*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Avoid git conflicts when tag and branch pushed at same time
        if: github.ref_type == 'tag'
        run: sleep 60

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need tags (for the switcher version list) and origin/gh-pages.
          fetch-depth: 0

      # No package.json here; mystmd is fetched on demand by npx (see the docs
      # target in the Makefile), so we only need Node on the PATH.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `make docs` reads build settings (incl. MYSTMD_VERSION) from CONFIG.
      - name: Create CONFIG
        run: cp CONFIG.example CONFIG

      - name: Sanitize ref name for docs version
        run: echo "DOCS_VERSION=${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}" >> $GITHUB_ENV

      # BASE_URL is required so assets/links resolve under the versioned Pages
      # sub-path (https://pandablocks.github.io/PandABlocks-server/$DOCS_VERSION/).
      - name: Build docs
        env:
          BASE_URL: /PandABlocks-server/${{ env.DOCS_VERSION }}
        run: make docs

      # Two layouts from the one build: artifact/html for the uploaded artifact
      # (downstream relies on the `html` dir name), and pages/<version> for the
      # gh-pages publish tree, into which the action also writes switcher.json
      # and the root redirect.
      - name: Stage built docs
        run: |
          mkdir -p $RUNNER_TEMP/artifact $RUNNER_TEMP/pages
          cp -r docs/_build/html $RUNNER_TEMP/artifact/html
          cp -r docs/_build/html $RUNNER_TEMP/pages/$DOCS_VERSION

      - name: Upload built docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: ${{ runner.temp }}/artifact

      - name: Write switcher.json + redirect
        uses: DiamondLightSource/myst-version-switcher-plugin/switcher@v0.2.0
        with:
          version: ${{ env.DOCS_VERSION }}
          repo: ${{ github.repository }}
          output-dir: ${{ runner.temp }}/pages

      - name: Publish Docs to gh-pages
        if: github.ref_type == 'tag' || github.ref_name == 'main' || github.ref_name == 'docs'
        # We pin to the SHA, not the tag, for security reasons.
        # https://docs.github.com/en/actions/learn-github-actions/security-hardening-for-github-actions#using-third-party-actions
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/pages
          keep_files: true
